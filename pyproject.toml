[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ba-battle-recorder"
version = "0.1.0"
description = "Windows 战斗视频录制、技能轴编辑与回放工具"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
dependencies = ["mss>=10,<11", "pynput>=1.7.7,<2", "pywin32>=306; sys_platform == 'win32'", "opencv-python>=4.10,<5", "numpy>=1.26,<3", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
test = ["jsonschema>=4.21,<5", "opencv-python>=4.10,<5", "numpy>=1.26,<3"]
recognition = ["opencv-python>=4.10,<5", "numpy>=1.26,<3"]
gui = ["PySide6>=6.7,<7", "av>=14,<17"]
video = ["av>=14,<17", "opencv-python>=4.10,<5", "numpy>=1.26,<3"]
capture = ["windows-capture==2.0.1; sys_platform == 'win32'"]

[project.scripts]
ba-recorder = "ba_recorder.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "COPYRIGHT.md", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
